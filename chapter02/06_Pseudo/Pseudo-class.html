<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-class</title>
    <style>
        form{
            height: 400px;
            width: 350px;
            background-color: #1a1a1a;
            color: aliceblue;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        #btn{
            background-color: blue;
            color: aliceblue;
            transition:ease-in-out;
        }
        /* #btn:hover{
            background-color: aliceblue;
            color: black;
            cursor:pointer;
            height: 50px;
            width: 120px;
        } */
        #btn:active{
            background-color: aliceblue;
            color: black;
            cursor:pointer;
            height: 50px;
            width: 120px;
        }
        input:focus{
            font-size: 20px;
            background-color: #3a3a3a;
        }
        a:visited{
            color: aliceblue;
        }
        h1:first-child{
            color: chartreuse;
            background-color: blue;
        }
        h1:nth-child(3){
            background-color: brown;
        }
        input:disabled{
            background-color: red;
        }
        input::placeholder{
            font-style: italic;
        }
        button{
            background-color: #3a3a3a;
            color: #fff;
        }
        button:hover{
            background-color: black;
            height: 80px;
            width: 140px;
        }
        p:first-child{
            background-color: #3a3a3a;
        }
        li::before{
            content: "-> ";

        }
        li::after{
            content: "<- ";
        }
        /* p::first-letter{
            font-style: italic;
            font-size: 30px;
        } */
        .first-Lt{
            font-style: italic;
            font-size: 30px;
            background-color: brown;
        }
    </style> 
</head>
<body>
