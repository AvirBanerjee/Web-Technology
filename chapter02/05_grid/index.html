         .layout {
            display: grid;
            grid-template-columns: 200px 1fr;
            grid-template-rows: auto 1fr auto;
            grid-template-areas:
                "header header"
                "nav    main"
                "footer footer";
            gap: 10px;
            min-height: 100vh;
        }

        header { grid-area: header; background-color: orange; border: 2px solid black;}
        nav    { grid-area: nav;background-color: orange; border: 2px solid black; }
        main   { grid-area: main;background-color: orange; border: 2px solid black; }
        footer { grid-area: footer; background-color: orange; border: 2px solid black;}
        
        
    </style>
</head>

    <div class="layout">
        <header>Header</header>
        <nav>Sidebar</nav>
        <main>Main Content</main>
        <footer>Footer</footer>
