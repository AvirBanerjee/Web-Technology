<!DOCTYPE html>
<html lang="en">
<head>

    <title>Recipe</title>
</head>
<body>
    <h1>Masala Chai</h1>
    <h2>Ingredients</h2>
    <ul>
        <li>WATER</li>
        <li>MILK</li>
        <li>GINGER</li>
        <li>SUGAR</li>
        <li>TEA</li>
    </ul>
    <h2>Steps</h2>
    <ol>
        <li>boil water</li>
        <li>add tea</li>
        <li>add Milk</li>
        <li>Let it boil for 2 mins</li>
        <span><li>add sugar</li></span><em>(Add Ginger at the end)</em>  
        <li>add Ginger</li>
        <li>boil again for 2mins</li>
        <li>tea is ready</li>
    </ol>
    <strong>Do not overcook</strong>
</body>
